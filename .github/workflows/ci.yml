name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    name: Build · Typecheck · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository-only DB access (guard)
        run: bash scripts/check-no-direct-prisma.sh

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: file:./ci.db

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          DATABASE_URL: file:./ci.db

      # Phase 4.7 — enforces CLAUDE.md "60%+ on engine paths" gate.
      # Per-path thresholds live in apps/server/vitest.config.ts.
      - name: Coverage (engine-path gate)
        run: npm run test:coverage --workspace=apps/server
        env:
          DATABASE_URL: file:./ci.db
